[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowcall"
version = "0.1.0"
description = "Make one API call per row of a CSV file, safely: dry runs, rate limits, retries, and a results file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rowcall = "rowcall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
